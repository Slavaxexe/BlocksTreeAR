<title>AutoResearch site_eui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Лабораторный журнал: холодная бумага, чернила, бирюзовый маркер; данные — моноширинным. Колонка 1120px, секции по порядку этапов. */
:root{
  --bg:#eef2f1; --paper:#f8faf9; --ink:#15201d; --mute:#5d6b67; --line:#d5dedb; --accent:#0b6c72; --accent-soft:#d6ebea;
  --good:#1b7f4b; --bad:#b4501d; --warn:#9a6b0f; --grid:#e3e9e7;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --f-body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1312;--paper:#151c1a;--ink:#e2eae7;--mute:#91a19c;--line:#26302d;--accent:#4fb8bd;--accent-soft:#163033;--good:#52c98a;--bad:#f0915a;--warn:#e2b44d;--grid:#1e2725;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1312;--paper:#151c1a;--ink:#e2eae7;--mute:#91a19c;--line:#26302d;--accent:#4fb8bd;--accent-soft:#163033;--good:#52c98a;--bad:#f0915a;--warn:#e2b44d;--grid:#1e2725;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:32px 72px;display:flex;flex-direction:column;gap:40px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,44px);font-weight:700;letter-spacing:-.01em;line-height:1.05}
h2{font-size:22px;font-weight:700}
.lede{color:var(--mute);max-width:68ch;margin:8px 0 0}
.eyebrow{font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.sub{color:var(--mute);font-size:14px;max-width:72ch;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:20px}
.kpi{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font:500 26px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:12.5px}
.kpi.hl b{color:var(--accent)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.flow{grid-template-columns:1fr}}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage .n{font:500 12px var(--f-mono);color:var(--mute)}
.stage h3{margin:0;font:600 15px var(--f-body)}
.stage p{margin:0;font-size:13px;color:var(--mute)}
.stage .fact{font:12.5px var(--f-mono);color:var(--ink);overflow-wrap:anywhere}
.who{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 11px var(--f-mono);padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.q{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.good{color:var(--good);border-color:currentColor}.chip.bad{color:var(--bad);border-color:currentColor}.chip.warn{color:var(--warn);border-color:currentColor}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font:11px var(--f-mono)}
.ladder{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:86px minmax(0,1fr) 110px 90px;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
@media(max-width:620px){.step{grid-template-columns:70px minmax(0,1fr) 80px}.step .d{display:none}}
.step .cv{font:500 15px var(--f-mono);text-align:right}
.step .d{font:12.5px var(--f-mono);color:var(--good);text-align:right}
.step .what{min-width:0}.step .what b{font-weight:600}.step .what div{color:var(--mute);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 64px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.bar .track{height:10px;background:var(--grid);border-radius:99px;overflow:hidden}.bar .fill{height:100%;background:var(--accent)}
.bar .v{font:12.5px var(--f-mono);text-align:right}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11.5px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);position:sticky;top:0;background:var(--paper)}
td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.best td{background:var(--accent-soft)}
.small{font-size:12.5px;color:var(--mute)}
pre{margin:0;font:12px/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}
details summary{cursor:pointer;font-weight:600}
details summary:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--ink);font-size:14px;max-width:80ch}
</style>

<div class="wrap" id="app"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const R=JSON.parse(document.getElementById('data').textContent);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(x,d=2)=>x==null?'—':(+x).toFixed(d);
const app=document.getElementById('app');
const F=R.facts, ex=R.experiments, ok=ex.filter(e=>e.cv!=null);
const unit=R.unit||'';
const base=R.baseline, best=R.best_single, ens=R.ensemble||{};
const stopReason=(R.stages['5_research']||{}).summary?.stop_reason;
let h='';

// ---------- шапка
h+=`<header><div class="eyebrow">AutoResearch · регрессия · ${esc(R.task.metric.toUpperCase())}</div>
<h1>${esc(R.title||'Прогон пайплайна')}</h1>
<p class="lede">${esc(R.lede||'')}</p>
<div class="kpis">
 <div class="kpi hl"><span>Итог, ${esc(R.task.metric.toUpperCase())} на валидации</span><b>${f(R.final_cv)}</b></div>
 <div class="kpi"><span>Базовая линия</span><b>${f(base&&base.cv)}</b></div>
 <div class="kpi"><span>Снижение ошибки</span><b>${R.improvement_vs_baseline_pct==null?'—':'−'+R.improvement_vs_baseline_pct+'%'}</b></div>
 <div class="kpi"><span>Экспериментов</span><b>${ex.length}</b></div>
 <div class="kpi"><span>Время прогона</span><b>${Math.round(R.elapsed_s/60)} мин</b></div>
</div></header>`;

// ---------- этапы
const tc=F['audit.time'], ent=F['audit.entity'], adv=F['audit.adversarial']||{}, tgt=F['audit.target']||{}, val=F['validation']||{};
const blocks=F['feature_blocks']||{};
const stages=[
 ['0','Задача','task.md, шаблон ответа, словарь данных',`target=${R.task.target} · метрика ${R.task.metric} (${R.task.metric_source})`,['код','Qwen: сводка и риски']],
 ['1','Аудит данных','время, повторяющиеся объекты, сдвиг, хвост',`время: ${tc?tc.col:'нет'} · объект: ${ent?ent.key.join('+'):'нет'} · история у ${ent?Math.round(ent.test_rows_with_history*100):'—'}% test · сдвиг AUC ${adv.auc??'—'}`,['код','Qwen: выводы, ключи']],
 ['2','Валидация','повторяет устройство test',`${val.kind} · ${(val.folds||[]).join(' · ')}`,['код']],
 ['3','Признаки','блоки без утечки + код Qwen',Object.entries(blocks).map(([k,v])=>k+':'+v).join(' · '),['код','Qwen: свой код']],
 ['4','Базовая линия','точка отсчёта + страховочный ответ',`${base?base.summary:''} → ${f(base&&base.cv)}`,['код']],
 ['5','Цикл исследования','гипотеза → опыт → урок → память',`${ex.length} опытов · стоп: ${stopReason||'—'} · Qwen-вызовов ${R.llm.calls}`,['Qwen ⇄ память','эвристика — резерв']],
 ['6','Ансамбль','жадный отбор по OOF',`${ens.used?'ансамбль из '+Object.keys(ens.weights||{}).length:'одна модель'} · OOF ${f(ens.ensemble_score)} vs ${f(ens.best_single_score)}`,['код']],
 ['7','Финал','переобучение на всех данных, проверки',`submission: ${R.submission_checks&&R.submission_checks.ok?'проверки пройдены':'ошибка'} · ${R.submission_checks?R.submission_checks.rows:''} строк`,['код']],
];
h+=`<section><div><div class="eyebrow">Как устроен</div><h2>Восемь этапов, одна память</h2></div>
<p class="sub">Каждый этап пишет факты в общую память. Qwen перед каждым решением получает её целиком: что известно о данных, все эксперименты с вердиктами, свои прошлые уроки. Числа считает только код.</p>
<div class="flow">${stages.map(s=>`<div class="stage"><div class="n">этап ${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p><div class="fact">${esc(s[3])}</div><div class="who">${s[4].map(w=>`<span class="chip ${w.startsWith('Qwen')?'q':''}">${esc(w)}</span>`).join('')}</div></div>`).join('')}</div></section>`;

// ---------- почему валидация по времени
if(R.validation_evidence){const v=R.validation_evidence;
h+=`<section><div><div class="eyebrow">Почему так валидируем</div><h2>Test — следующий год, и валидация обязана это повторять</h2></div>
<p class="note">${esc(v.text)}</p></section>`}

// ---------- график
if(ok.length){
 const W=1080,H=300,L=56,Rr=16,T=16,B=36;const ys=ok.map(e=>e.cv);let lo=Math.min(...ys),hi=Math.max(...ys);const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
 const sx=i=>L+i*(W-L-Rr)/Math.max(1,ok.length-1), sy=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 let run=null;const bestLine=ok.map((e,i)=>{run=run==null?e.cv:Math.min(run,e.cv);return [sx(i),sy(run)]});
 const ticks=5;let grid='';for(let k=0;k<=ticks;k++){const v=lo+(hi-lo)*k/ticks;grid+=`<line x1="${L}" x2="${W-Rr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${sy(v)+4}" text-anchor="end">${v.toFixed(1)}</text>`}
 const col=v=>v==='new_best'||v==='baseline'?'var(--good)':v==='worse'?'var(--bad)':'var(--mute)';
 const area=`M${bestLine[0][0]},${H-B} `+bestLine.map(p=>'L'+p[0]+','+p[1]).join(' ')+` L${bestLine[bestLine.length-1][0]},${H-B} Z`;
 h+=`<section><div><div class="eyebrow">Ход исследования</div><h2>Каждая точка — эксперимент</h2></div>
 <div class="panel"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(R.task.metric)} по экспериментам">${grid}
 <path d="${area}" fill="var(--accent-soft)" opacity=".6"/>
 <polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="${bestLine.map(p=>p.join(',')).join(' ')}"/>
 ${ok.map((e,i)=>`<circle cx="${sx(i)}" cy="${sy(e.cv)}" r="${e.verdict==='new_best'?6:4.5}" fill="${col(e.verdict)}" stroke="var(--paper)" stroke-width="1.5"><title>${esc(e.id)} · ${esc(e.summary)} · ${f(e.cv,4)}</title></circle>`).join('')}
 <text x="${L}" y="${H-12}">${esc(ok[0].id)}</text><text x="${W-Rr}" y="${H-12}" text-anchor="end">${esc(ok[ok.length-1].id)}</text>
 <text x="${L+4}" y="${T+10}">${esc(R.task.metric.toUpperCase())}${unit?', '+esc(unit):''} ↓ лучше</text></svg>
 <div class="legend"><span><i class="dot" style="background:var(--good)"></i>новый лучший</span><span><i class="dot" style="background:var(--mute)"></i>без выигрыша</span><span><i class="dot" style="background:var(--bad)"></i>хуже</span><span><i class="dot" style="background:var(--accent)"></i>лучший на момент</span></div></div></section>`}

// ---------- лестница улучшений
const steps=ex.filter(e=>e.verdict==='new_best'||e.verdict==='baseline');
h+=`<section><div><div class="eyebrow">Что сработало</div><h2>Путь от базовой линии к лучшей модели</h2></div>
<div class="panel ladder">${steps.map(e=>`<div class="step"><span class="mono small">${esc(e.id)}</span><div class="what"><b>${esc(e.hypothesis)}</b><div>${esc(e.why||e.summary)}</div></div><span class="cv">${f(e.cv,3)}</span><span class="d">${e.delta_best_pct==null?'старт':'−'+e.delta_best_pct+'%'}</span></div>`).join('')}
${ens.used?`<div class="step"><span class="mono small">ансамбль</span><div class="what"><b>Смесь ${Object.keys(ens.weights).length} моделей</b><div>${esc(Object.entries(ens.weights).map(([k,w])=>k+' ×'+w).join(', '))}</div></div><span class="cv">${f(ens.ensemble_score,3)}</span><span class="d">−${ens.rel_gain_pct}%</span></div>`:''}</div>
<p class="small">Числа — ${esc(R.task.metric.toUpperCase())} на фолдах валидации; ансамбль считается на тех же строках (OOF), поэтому его число сравнимо с OOF лучшей модели (${f(ens.best_single_score,3)}), а не с её средним по фолдам.</p></section>`;

// ---------- где ошибка
const sg=(best&&best.segments)||{};
const hist=['with_history','without_history'].filter(k=>sg['rmse_'+k]!=null);
const maxR=Math.max(...hist.map(k=>sg['rmse_'+k]),...((sg.worst_segments||[]).map(s=>s.rmse)),1);
h+=`<section><div><div class="eyebrow">Где ошибка сейчас</div><h2>Остаток ошибки лучшей модели</h2></div>
<div class="two"><div class="panel"><div class="small" style="margin-bottom:6px">Есть ли у объекта своя история</div>
${hist.map(k=>`<div class="bar"><span>${k==='with_history'?'с историей':'без истории'} · ${Math.round(sg['share_'+k]*100)}% строк</span><span class="track"><span class="fill" style="display:block;width:${sg['rmse_'+k]/maxR*100}%"></span></span><span class="v">${f(sg['rmse_'+k])}</span></div>`).join('')}
<div class="bar"><span>без худшего 1% строк</span><span class="track"><span class="fill" style="display:block;width:${(sg.rmse_without_top1pct||0)/maxR*100}%"></span></span><span class="v">${f(sg.rmse_without_top1pct)}</span></div>
<p class="small">1% строк дают ${sg.top1pct_rows_share_of_sq_error==null?'—':Math.round(sg.top1pct_rows_share_of_sq_error*100)+'%'} суммы квадратов ошибки.</p></div>
<div class="panel"><div class="small" style="margin-bottom:6px">Сегменты с наибольшей долей ошибки</div>
${(sg.worst_segments||[]).map(s=>`<div class="bar"><span style="overflow-wrap:anywhere">${esc(s.segment)} · ${s.rows}</span><span class="track"><span class="fill" style="display:block;width:${s.share_of_sq_error*100}%;background:var(--warn)"></span></span><span class="v">${Math.round(s.share_of_sq_error*100)}%</span></div>`).join('')}</div></div></section>`;

// ---------- таблица
h+=`<section><div><div class="eyebrow">Журнал</div><h2>Все эксперименты</h2></div>
<div class="tbl"><table><thead><tr><th>id</th><th>кто</th><th>гипотеза и что изменили</th><th>${esc(R.task.metric)}</th><th>по фолдам</th><th>train</th><th>Δ к лучшему</th><th>вердикт</th></tr></thead><tbody>
${ex.map(e=>{const v=e.verdict, cls=v==='new_best'||v==='baseline'?'good':v==='worse'||v==='failed'?'bad':v==='better_than_parent'?'warn':'';
return `<tr class="${best&&e.id===best.id?'best':''}"><td class="mono">${esc(e.id)}<div class="small">← ${esc(e.parent||'—')}</div></td><td><span class="chip ${e.source==='qwen'?'q':''}">${esc(e.source)}</span></td>
<td><b>${esc(e.hypothesis)}</b><div class="small mono">${esc(e.summary)}</div>${e.analysis?`<div class="small">урок: ${esc(e.analysis)}</div>`:''}${e.error?`<div class="small" style="color:var(--bad)">${esc(String(e.error).slice(0,220))}</div>`:''}</td>
<td class="num">${f(e.cv,3)}</td><td class="num">${(e.folds||[]).map(x=>f(x,1)).join(' / ')}</td><td class="num">${f(e.train_cv,1)}</td><td class="num">${e.delta_best_pct==null?'—':e.delta_best_pct+'%'}</td><td><span class="chip ${cls}">${esc(v)}</span></td></tr>`}).join('')}
</tbody></table></div></section>`;

// ---------- память
h+=`<section><div><div class="eyebrow">Память</div><h2>Что Qwen видит перед решением</h2></div>
<p class="sub">Сжатая память собирается из журнала перед каждым вызовом. Старые шаги идут одной строкой, свежие подробно, но ни один эксперимент не пропадает.</p>
<div class="panel"><details><summary>Открыть память на момент последнего шага (${(R.memory_sample||'').length} символов)</summary><pre>${esc(R.memory_sample||'')}</pre></details></div>
<div class="two"><div class="panel"><div class="small" style="margin-bottom:6px">Выводы в памяти</div>${(R.insights||[]).map(i=>`<div style="padding:4px 0">${esc(i.text)} <span class="chip ${i.source.startsWith('qwen')?'q':''}">${esc(i.source)}</span></div>`).join('')||'<div class="small">Появятся в прогоне с Qwen.</div>'}</div>
<div class="panel"><div class="small" style="margin-bottom:6px">Отклонённые предложения и почему</div>${(R.rejected_proposals||[]).slice(-6).map(r=>`<div style="padding:4px 0"><b>${esc(r.proposal)}</b><div class="small">${esc((r.reasons||[]).join('; ').slice(0,240))}</div></div>`).join('')||'<div class="small">Нет.</div>'}</div></div></section>`;

app.innerHTML=h;
</script>
